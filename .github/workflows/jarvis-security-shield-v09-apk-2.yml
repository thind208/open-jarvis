      - name: Download offline English and Hindi speech models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jarvis-security-v09/app/src/main/assets/models /tmp/ja-hi-model /tmp/ja-en-model
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/ja-hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/ja-en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/ja-hi.zip -d /tmp/ja-hi-model
          unzip -q /tmp/ja-en.zip -d /tmp/ja-en-model
          test -f /tmp/ja-hi-model/vosk-model-small-hi-0.22/am/final.mdl
          test -f /tmp/ja-en-model/vosk-model-small-en-us-0.15/am/final.mdl
          mv /tmp/ja-hi-model/vosk-model-small-hi-0.22 jarvis-security-v09/app/src/main/assets/models/hi
          mv /tmp/ja-en-model/vosk-model-small-en-us-0.15 jarvis-security-v09/app/src/main/assets/models/en
      - name: Build isolated JARVIS Security Shield APK
        working-directory: jarvis-security-v09
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' :app:assembleDebug
      - name: Save APK only if build succeeds
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-SecurityShield-v09-Debug-APK
          path: jarvis-security-v09/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
